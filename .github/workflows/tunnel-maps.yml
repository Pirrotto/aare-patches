name: Tunnel maps

# The tunnel maps for the tunnel estimate: built from OpenStreetMap, signed, and
# published as assets of the "tunnel-maps" release (a pre-release, never "latest", so Morphe and the
# patch releases ignore it). Only countries whose file changed are uploaded again. On a pull request
# that touches the builder, only its tests and a dry run for one country, nothing published.
# Every day it builds the countries that are due (missing, or built more than 30 days ago), the
# owner's country and its neighbours first, and stops before GitHub's time limit: what is left is
# done the next day, so each country is rebuilt about once a month. GitHub runs the schedule and the
# manual start only from main; a push to dev that changes the builder publishes too, so the maps can
# be tried with the test builds before a release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'tools/tunnelmaps/**'
      - '.github/workflows/tunnel-maps.yml'
  pull_request:
    paths:
      - 'tools/tunnelmaps/**'
      - '.github/workflows/tunnel-maps.yml'

concurrency:
  group: tunnel-maps
  cancel-in-progress: false

jobs:
  test:
    name: Builder tests and a dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tunnelmaps -v
      - name: Dry run (Switzerland, not published)
        # The shared Overpass servers are sometimes busy (504): that says nothing about the builder,
        # so it doesn't stop publishing, which tries every country again anyway.
        continue-on-error: true
        run: |
          mkdir -p work
          python3 tools/tunnelmaps/tunnelmaps.py country CH --out work
          ls -la work

  publish:
    name: Build, sign and publish
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: tunnel-maps
    steps:
      - uses: actions/checkout@v7

      - name: The release (created once)
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false \
            --title "Tunnel maps" --notes "Road tunnels for the tunnel estimate, one file per country, signed. Updated monthly. Data © OpenStreetMap contributors, ODbL 1.0."

      - name: Build, sign and publish, one country at a time
        env:
          TUNNEL_MAPS_KEY: ${{ secrets.TUNNEL_MAPS_KEY }}
          # Built and published first: the owner's country and its neighbours.
          FIRST: CH,LI,DE,AT,IT,FR
        run: |
          set -uo pipefail
          if [ -z "$TUNNEL_MAPS_KEY" ]; then echo "::error::the TUNNEL_MAPS_KEY secret is missing"; exit 1; fi
          umask 077
          key="$RUNNER_TEMP/tunnel-maps-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TUNNEL_MAPS_KEY" > "$key"
          mkdir -p work old
          gh release download "$TAG" --pattern index.txt --dir old || echo "no index published yet"
          # An index of the first format (before one file per country): start afresh, and take its
          # files (CH.tun, CH.tun.sig...) off the page, which only that format used.
          if [ -s old/index.txt ] && [ "$(head -n1 old/index.txt)" != "AARETUN-INDEX 2" ]; then
            : > old/index.txt
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^[A-Z]{2}\.tun(\.sig)?$' | while read -r a; do
              gh release delete-asset "$TAG" "$a" --yes
            done
          fi
          touch old/index.txt
          cp old/index.txt work/index.txt
          # ECDSA P-256 over SHA-256 (DER), as the phone checks it (SHA256withECDSA).
          sign() { openssl dgst -sha256 -sign "$key" -out "$1.sig" "$1"; }
          list=$(python3 tools/tunnelmaps/tunnelmaps.py due old/index.txt --first "$FIRST") || { echo "::error::country list not loaded"; exit 1; }
          echo "$(echo "$list" | grep -c .) countries due"
          done=0; same=0; failed=""; left=0
          while read -r cc file; do
            [ -n "$cc" ] || continue
            # Stop well before the job's limit (350 min): the rest is due again tomorrow.
            if [ "$SECONDS" -gt $((320 * 60)) ]; then left=$((left + 1)); continue; fi
            built=$(python3 tools/tunnelmaps/tunnelmaps.py country "$cc" --out work) || { failed="$failed $cc"; continue; }
            [ -n "$built" ] || continue  # no tunnel worth a map
            read -r sha ways <<< "$built"
            old=$(awk -v c="$cc" '$1 == c { print $2 }' old/index.txt)
            if [ "$sha" = "$old" ]; then
              # Unchanged: only its date in the index, so it isn't due again for a month.
              same=$((same + 1)); rm -f "work/$cc.tun"
              python3 tools/tunnelmaps/tunnelmaps.py touch work/index.txt "$cc"
              sign work/index.txt
              gh release upload "$TAG" work/index.txt work/index.txt.sig --clobber || failed="$failed $cc"
              continue
            fi
            # One file per country, named in English: the map with its signature. The file first, then
            # the index naming it: a phone never sees an index naming a file that isn't there yet.
            # Published now, so a later timeout loses nothing.
            sign "work/$cc.tun"
            line=$(python3 tools/tunnelmaps/tunnelmaps.py pack "work/$cc.tun" "work/$cc.tun.sig" "work/$file" "$cc" "$ways")
            python3 tools/tunnelmaps/tunnelmaps.py merge work/index.txt "$line"
            sign work/index.txt
            if gh release upload "$TAG" "work/$file" --clobber \
                && gh release upload "$TAG" work/index.txt work/index.txt.sig --clobber; then
              done=$((done + 1))
              echo "$cc published as $file"
            else
              failed="$failed $cc"
            fi
            rm -f "work/$cc.tun" "work/$cc.tun.sig" "work/$file"
            sleep 5  # Overpass is shared: one country at a time
          done <<< "$list"
          echo "published $done, unchanged $same, left for tomorrow $left, failed:${failed:- none}"
          # A failed country keeps its published file; it is tried again at the next run.
