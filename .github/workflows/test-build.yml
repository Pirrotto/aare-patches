name: Test build

# Every branch but main: tests, build, and the patches applied to the official AARE APK.
# On dev the patches file is kept as a private test build (an artifact, not a release).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test-build:
    name: Test, build, apply to AARE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AARE_VERSION: "1.6.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Secrets check
        run: .github/scripts/check-secrets.sh

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Label the build (date, time and change)
        id: label
        run: |
          # Shown at the bottom of the patches' Settings and in "Copy diagnostics".
          STAMP="$(TZ=Europe/Zurich date +%Y%m%d-%H%M)"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "PATCH_BUILD_LABEL=test $STAMP · ${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :extensions:extension:test --no-daemon

      - name: Lint (Android lint on the patches' code; new issues only, see lint-baseline.xml)
        run: ./gradlew :extensions:extension:lintDebug --no-daemon || { cat extensions/extension/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }

      - name: Build patches
        run: ./gradlew :patches:buildAndroid --no-daemon && ls -la patches/build/libs

      - name: Apply to the official AARE APK
        run: |
          set -e
          mkdir -p work
          gh release download "v$AARE_VERSION" -R prototux/AARE --pattern '*.apk' --dir work
          gh release download -R MorpheApp/morphe-cli --pattern '*.jar' --dir work/cli
          ls -la work work/cli
          CLI=$(ls work/cli/*.jar | head -1)
          java -jar "$CLI" patch --validate -p patches/build/libs/patches-*.mpp -o work/patched.apk work/aare-*.apk 2>&1 | tee work/apply.log
          # Every patch must apply: none skipped as incompatible, none failed.
          if grep -iE "skipping|failed|severe|exception" work/apply.log; then exit 1; fi
          ls -la work/patched.apk

      - name: Name the test build (date, time and change)
        id: name
        if: github.ref == 'refs/heads/dev'
        run: |
          # A different name for every test build, so they can be told apart on the phone.
          NAME="aare-patches-test-${{ steps.label.outputs.stamp }}-${GITHUB_SHA::7}.mpp"
          mkdir -p work/test-build
          cp patches/build/libs/patches-*.mpp "work/test-build/$NAME"
          ls -la work/test-build
          echo "name=${NAME%.mpp}" >> "$GITHUB_OUTPUT"

      - name: Keep the test build (dev only)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.name.outputs.name }}
          path: work/test-build/*.mpp
          archive: false
          retention-days: 14

      - name: Keep the patched APK for the emulator test (1 day)
        uses: actions/upload-artifact@v6
        with:
          name: patched-apk-${{ github.run_id }}
          path: work/patched.apk
          retention-days: 1

  emulator:
    name: Emulator smoke test (starts, Settings, car screen preview)
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the patched APK
        uses: actions/download-artifact@v7
        with:
          name: patched-apk-${{ github.run_id }}
          path: work

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run AARE on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: .github/scripts/emulator-smoke.sh work/patched.apk work/smoke

      - name: Keep screenshots and log (3 days)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-smoke-${{ github.run_id }}
          path: work/smoke
          retention-days: 3
